services:
  haproxy:
    image: haproxy:lts-trixie
    container_name: haproxy
    user: root
    dns: 8.8.8.8
    network_mode: host
    privileged: true
    restart: always
    environment:
      - TZ=Asia/Tehran
    cap_add:
      - NET_ADMIN
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    #entrypoint: >
      #/bin/sh -c "
      #chmod +x /usr/local/bin/setup.sh;
      #/usr/local/bin/setup.sh;
      #exec /usr/local/bin/docker-entrypoint.sh \"\$$@\"
      #"
    volumes:
      - .:/workspaces/codespace-haproxy:cached
      #- ./sysctl.d:/etc/sysctl.d:ro
      - ./config:/usr/local/etc/haproxy:ro
      #- ./setup.sh:/usr/local/bin/setup.sh:ro
