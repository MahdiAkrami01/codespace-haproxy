services:
  dev:
    image: mcr.microsoft.com/devcontainers/base:debian
    network_mode: host
    volumes:
        - .:/workspaces/codespace-haproxy:cached
    command: sleep infinity

  haproxy:
    image: haproxy:lts-alpine
    container_name: haproxy
    user: root
    dns: 8.8.8.8
    network_mode: host
    privileged: true
    restart: always
    environment:
      - TZ=Asia/Tehran
    cap_add:
      - NET_ADMIN
    volumes:
      - ./config:/usr/local/etc/haproxy:ro
