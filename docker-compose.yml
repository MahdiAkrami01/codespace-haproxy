services:
  haproxy:
    image: haproxy:lts-alpine
    container_name: haproxy
    user: root
    dns: 8.8.8.8
    network_mode: host
    privileged: true
    restart: always
    environment:
      - TZ=Asia/Tehran
    cap_add:
      - NET_ADMIN
    volumes:
      - ./config:/usr/local/etc/haproxy:ro
