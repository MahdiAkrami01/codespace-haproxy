# File system limits
fs.pipe-max-size = 1048576
fs.file-max = 2097152

# BBR Congestion Control & Queue Disciplines
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# TCP Window Scaling and Buffer Limits (Balanced for 8GB RAM)
net.ipv4.tcp_window_scaling = 1

# Maximum memory standard caps (16MB max limits are perfectly fine)
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216

# Default memory caps (Lowered to 256KB to safe-guard RAM overhead per connection)
net.core.rmem_default = 262144
net.core.wmem_default = 262144

# Dynamic TCP Auto-tuning Buffers
# Format: [min_bytes] [default_bytes] [max_bytes]
# Adjusted the default/midpoint value to save substantial memory on concurrency
net.ipv4.tcp_rmem = 4096 131072 16777216
net.ipv4.tcp_wmem = 4096 131072 16777216

# Connection Backlog Adjustments (Tuned nicely for a 2-Core system processing traffic)
net.core.netdev_max_backlog = 10000
net.core.somaxconn = 4096
net.ipv4.tcp_max_syn_backlog = 4096

# Timeouts & Keepalives (Reclaim stale connection sockets faster)
net.ipv4.tcp_fin_timeout = 15
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_keepalive_time = 300
net.ipv4.tcp_keepalive_intvl = 15
net.ipv4.tcp_keepalive_probes = 5

# Additional Enhancements
net.mptcp.enabled = 0
net.ipv4.tcp_fastopen = 3
