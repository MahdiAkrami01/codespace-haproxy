defaults
    maxconn  50000

    mode                    tcp
    log                     global
    option                  tcplog
    option                  dontlognull
#    option tcp-check
#    option ssl-hello-chk
#    option tcpka
#    option srvtcpka
#    option clitcpka
#    option abortonclose
#    option http-server-close
    option tcp-smart-accept
    option tcp-smart-connect
    option splice-auto
#    option prefer-last-server
   # option forwardfor       except 127.0.0.0/8
    option                  redispatch
    retries                 2
    retry-on                conn-failure empty-response response-timeout
#    retry-on                all-retryable-errors
    timeout http-request    10s
    timeout queue           10s
    timeout connect         15s
    timeout client          5s
    timeout server          5s
    timeout http-keep-alive 5s
    timeout check           50ms
    timeout client-fin      5s
    timeout server-fin      5s
    timeout tunnel          1h

    #default-server tfo check init-state up inter 5s fastinter 2s downinter 500ms fall 3 rise 2 observe layer4 error-limit 3 on-error fail-check
    default-server tfo

listen statsLocal
    mode http
    bind 127.0.0.1:1936
    stats enable
    stats show-legends
    stats refresh 5s
    stats realm Haproxy\ Statistics
    stats uri /

listen aws
    mode tcp
    bind 127.0.0.1:9443 shards by-thread tfo mss 1400
    
